    <script>
        const themeSwitch = document.getElementById('themeSwitch');
        const body = document.body;
        const navbar = document.getElementById('navbar');
        // const datepicker = document.getElementById('datepicker');
        // const todayLink = document.getElementById('todayLink');

        // Initialize Flatpickr for the date picker
        // flatpickr(datepicker);

        // Load theme from localStorage
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.setAttribute('data-bs-theme', 'dark');
                themeSwitch.checked = true;
                updateNavbarTheme(true);
            } else {
                body.setAttribute('data-bs-theme', 'light');
                themeSwitch.checked = false;
                updateNavbarTheme(false);
            }
        }

        // Update Navbar Theme
        function updateNavbarTheme(isDark) {
            if (isDark) {
                navbar.classList.remove('navbar-light', 'bg-light');
                navbar.classList.add('navbar-dark', 'bg-dark');
            } else {
                navbar.classList.remove('navbar-dark', 'bg-dark');
                navbar.classList.add('navbar-light', 'bg-light');
            }
        }

        // Save theme to localStorage
        themeSwitch.addEventListener('change', () => {
            const isDark = themeSwitch.checked;
            body.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
            updateNavbarTheme(isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light'); // Persist the theme
        });

        // Handle "Today" link in calendar dropdown
        // todayLink.addEventListener('click', (e) => {
        //     e.preventDefault();
        //     const today = new Date().toISOString().split('T')[0];
        //     datepicker.value = today; // Set date picker to today
        // });

        // Initialize theme on page load
        loadTheme();
    </script>
